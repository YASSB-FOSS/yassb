<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <!-- component="site/head.html" -->
  <title>{ title } · YASSB docs</title>
  <meta name="description" content="{ description }">
  <meta property="og:title" content="{ title } · YASSB docs">
  <meta property="og:description" content="{ description }">
</head>
<body class="flex min-h-full bg-white font-sans dark:bg-slate-900">
  <div class="flex w-full flex-col">
    <!-- component="docs/header.html" -->
    <div class="relative mx-auto flex w-full max-w-8xl flex-auto justify-center sm:px-2 lg:px-8 xl:px-12">
      <div class="hidden lg:relative lg:block lg:flex-none">
        <div class="absolute inset-y-0 right-0 w-[50vw] bg-slate-50 dark:hidden"></div>
        <div class="absolute top-16 right-0 bottom-0 hidden h-12 w-px bg-linear-to-t from-slate-800 dark:block"></div>
        <div class="absolute top-28 right-0 bottom-0 hidden w-px bg-slate-800 dark:block"></div>
        <div class="sticky top-[4.75rem] -ml-0.5 h-[calc(100vh-4.75rem)] w-64 overflow-x-hidden overflow-y-auto py-16 pr-8 pl-0.5 xl:w-72 xl:pr-16">
          <!-- public-file-list="docs" renderer="docsNav" -->
        </div>
      </div>
      <div class="max-w-2xl min-w-0 flex-auto px-4 py-16 lg:max-w-none lg:pr-0 lg:pl-8 xl:px-16">
        <article data-section="{ section }">
          <header class="mb-9 space-y-1">
            <p class="font-display text-sm font-medium text-violet-500">{ section }</p>
            <h1 class="font-display text-3xl tracking-tight text-slate-900 dark:text-white">{ title }</h1>
          </header>
          <div class="prose max-w-none prose-slate dark:text-slate-400 dark:prose-invert prose-headings:scroll-mt-28 prose-headings:font-display prose-headings:font-normal prose-lead:text-slate-500 dark:prose-lead:text-slate-400 prose-a:font-semibold prose-a:text-slate-900 dark:prose-a:text-violet-400 prose-a:no-underline prose-a:shadow-[inset_0_-2px_0_0_var(--color-white),inset_0_-6px_0_0_var(--color-violet-200)] hover:prose-a:shadow-[inset_0_-2px_0_0_var(--color-white),inset_0_-10px_0_0_var(--color-violet-200)] dark:prose-a:shadow-[inset_0_-2px_0_0_var(--color-violet-800)] prose-code:font-mono prose-code:before:content-none prose-code:after:content-none prose-code:rounded-md prose-code:bg-slate-100 prose-code:px-1.5 prose-code:py-0.5 prose-code:font-normal dark:prose-code:bg-slate-800 prose-table:text-sm dark:prose-hr:border-slate-800">
            <!-- generate-from-files="docs" -->
          </div>
        </article>
        <!-- public-file-list="docs" renderer="docsPager" -->
      </div>
      <div class="hidden xl:sticky xl:top-[4.75rem] xl:-mr-6 xl:block xl:h-[calc(100vh-4.75rem)] xl:flex-none xl:overflow-y-auto xl:py-16 xl:pr-6">
        <nav data-toc></nav>
      </div>
    </div>
  </div>
  <div data-mobile-nav hidden class="fixed inset-0 z-50 flex items-start overflow-y-auto bg-slate-900/50 pr-10 backdrop-blur-sm lg:hidden">
    <div class="min-h-full w-full max-w-xs bg-white px-4 pt-5 pb-12 sm:px-6 dark:bg-slate-900">
      <div class="flex items-center gap-4">
        <button type="button" data-mobile-nav-close aria-label="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" class="h-6 w-6 stroke-slate-500"><path d="M5 5l14 14M19 5l-14 14"/></svg>
        </button>
        <a href="/" aria-label="Home"><!-- component="site/logo-mark.html" --></a>
      </div>
      <div class="mt-5 px-1">
        <!-- public-file-list="docs" renderer="docsNav" -->
      </div>
    </div>
  </div>
  <!-- component="docs/search.html" -->
  <!-- include-script-src -->
</body>
</html>
